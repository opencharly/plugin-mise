curl-tar:
    candy:
        version: 2026.242.0000
        description: |-
            The toolchain the mise builder stage needs (the stage downloads the
            pinned mise release and its install_command drives tool builds —
            python-build shims bash on musl bases like Alpine, where bash is not
            preinstalled). Composed into the per-distro builder boxes; the
            package names resolve per the image's distro.
        package: [curl, tar, gzip, bash]
        plan:
            - check: the toolchain is present
              id: curl-tar-present
              command: curl --version

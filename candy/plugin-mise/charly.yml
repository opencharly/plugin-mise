
plugin-mise:
    candy:
        description: |-
            The mise builder + verb plugin: provisions the mise dev-tool manager
            (jdx/mise) into images via a build-time multi-stage (builder:mise,
            OpResolve) and runs mise commands as plan steps (verb:mise — OpEmit at
            image build, OpExecute at check/deploy). A candy selects the builder
            with `external_builder: mise`; a plan step runs `mise: <command>`.
        plugin:
            providers:
                - builder:mise
                - verb:mise
            source: github.com/opencharly/plugin-mise/candy/plugin-mise
            primary:
                mise: command
        plan:
            - check: the out-of-tree mise plugin ships a buildable Go module the host builds + serves out-of-process at image build (bake_plugin bakes the compiled binary to /usr/local/lib/charly/plugins/plugin-mise with its .providers manifest, so the runtime arm asserts the baked artifact)
              id: mise-module-present
              context:
                - build
              command: test -f go.mod || test -f /usr/local/lib/charly/plugins/plugin-mise.providers
            - check: the mise plugin ships its self-contained CUE schema (the served #MiseInput authoring contract) — build context ships schema/mise.cue; the baked runtime ships the compiled binary (the schema splice is asserted by kit-side tests)
              id: mise-schema-present
              context:
                - build
              command: test -f schema/mise.cue || test -f /usr/local/lib/charly/plugins/plugin-mise.providers

mise-skill:
    skill:
        name: mise
        family: image
        owner: plugin-mise
        description: |-
            The mise (`jdx/mise`) builder + plan-step verb — provision the mise dev-tool
            manager into images via the `external_builder: mise` multi-stage, and run
            `mise: <command>` steps at image build / check / deploy. Use when composing
            mise into a box or authoring a `mise:` step.
        triggers:
            - "`external_builder: mise` / the `mise:` plan-step verb / provisioning the mise dev-tool manager into an image"
